devices:
  - id: pc-main
    name: "My Desktop"
    mac: "AA:BB:CC:DD:EE:FF"      # the PC's NIC MAC address (Windows: ipconfig /all)
    lan_ip: "192.168.1.50"        # the PC's LAN IP - set a DHCP reservation so this never drifts
    broadcast: "192.168.1.255"    # your LAN's broadcast address (usually your subnet + .255)
    wol_ports: [9, 7]
    # agent_port + the "shutdown"/"restart" capabilities below are only meaningful once
    # my-home-pc-agent is installed and running on this PC (see its README) - remove both
    # if you only want Wake, which needs no PC-side software at all.
    agent_port: 8585
    capabilities: ["wake", "status", "shutdown", "restart"]
